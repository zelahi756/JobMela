<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JobMela.pk - Full System</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@700&family=Inter:wght@700;800&display=swap" rel="stylesheet">
<style>
body{font-family:'Inter',sans-serif;background:#FFF7ED}
.urdu{font-family:'Noto Nastaliq Urdu',serif;line-height:1.8}
.filter-active{background:#0F172A!important;color:white!important;border-color:#0F172A!important}
.card{transition:.25s;border:1px solid #FFEDD5}
.card:hover{transform:translateY(-5px);box-shadow:0 20px 40px -10px rgba(249,115,22,.2)}
</style>
</head>
<body>

<!-- Top Bar -->
<div class="bg-slate-900 text-white text-[11px] py-2 px-4 flex justify-between max-w-7xl mx-auto">
<span id="liveDate">پشاور | لوڈ...</span>
<span>🔥 10,000+ Users</span>
</div>

<!-- Header with Sign In -->
<header class="bg-white/90 backdrop-blur-xl sticky top-0 z-40 border-b">
<div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
<div class="flex items-center gap-2">
<div class="w-10 h-10 rounded-xl bg-gradient-to-br from-orange-500 to-blue-700 text-white flex items-center justify-center font-black">J</div>
<div>
<h1 class="font-black leading-none">JobMela.pk</h1>
<p class="urdu text-[11px] text-orange-600 font-bold -mt-1">آپ کا مستقبل، ہماری تلاش</p>
</div>
</div>
<button onclick="openLogin()" class="flex items-center gap-2 border-2 px-4 py-2 rounded-full text-xs font-bold hover:bg-slate-900 hover:text-white transition">
<span>👤</span> Sign In
</button>
</div>
</header>

<!-- Filters Section - Yeh woh buttons hain jo aap keh rahe thay -->
<section class="max-w-7xl mx-auto px-4 pt-4">
<div class="bg-white rounded-[20px] p-4 border shadow-sm">
<!-- Type Filters -->
<div class="flex gap-2 overflow-x-auto pb-2">
<button onclick="filterType('all')" id="btn-all" class="filter-active whitespace-nowrap border px-5 py-2.5 rounded-full text-xs font-bold">All Jobs (6)</button>
<button onclick="filterType('gov')" id="btn-gov" class="whitespace-nowrap border bg-slate-50 px-5 py-2.5 rounded-full text-xs font-bold">🏛️ سرکاری (4)</button>
<button onclick="filterType('private')" id="btn-private" class="whitespace-nowrap border bg-slate-50 px-5 py-2.5 rounded-full text-xs font-bold">🏢 پرائیویٹ (1)</button>
<button onclick="filterType('tender')" id="btn-tender" class="whitespace-nowrap border bg-slate-50 px-5 py-2.5 rounded-full text-xs font-bold">📋 ٹینڈر (1)</button>
</div>
<!-- Location + Search -->
<div class="flex flex-col md:flex-row gap-2 mt-3">
<select id="locFilter" onchange="filterJobs()" class="bg-slate-100 rounded-xl px-4 py-3 text-sm font-bold outline-none">
<option value="all">📍 تمام شہر</option>
<option value="peshawar">پشاور</option>
<option value="lahore">لاہور</option>
<option value="islamabad">اسلام آباد</option>
<option value="karachi">کراچی</option>
</select>
<input id="searchInput" oninput="filterJobs()" placeholder="تلاش کریں..." class="flex-1 bg-slate-100 rounded-xl px-4 py-3 text-sm outline-none text-right">
<button onclick="filterJobs()" class="bg-slate-900 text-white px-8 rounded-xl font-bold text-sm">Search</button>
</div>
</div>
</section>

<!-- Jobs Grid -->
<section class="max-w-7xl mx-auto px-4 py-5 pb-20">
<div id="jobsGrid" class="grid md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
</section>

<!-- Login Modal -->
<div id="loginModal" class="fixed inset-0 bg-black/50 hidden z-[60] p-4 flex items-center justify-center">
<div class="bg-white rounded-[24px] max-w-sm w-full p-7 text-center">
<h3 class="font-black text-xl">خوش آمدید!</h3>
<p class="urdu text-sm text-slate-500 mt-1">لاگ ان کر کے نوکریاں Save کریں</p>
<button class="w-full mt-5 bg-white border-2 py-3 rounded-xl font-bold text-sm">🔵 Continue with Google</button>
<button class="w-full mt-2 bg-slate-900 text-white py-3 rounded-xl font-bold text-sm">Continue as Guest</button>
<button onclick="closeLogin()" class="mt-4 text-xs text-slate-400">بند کریں</button>
</div>
</div>

<!-- Job Detail Modal -->
<div id="modal" class="fixed inset-0 bg-black/60 hidden z-50 p-4 flex items-center justify-center">
<div class="bg-white rounded-[24px] max-w-lg w-full p-6">
<button onclick="closeModal()" class="float-left bg-slate-100 w-8 h-8 rounded-full">✕</button>
<div id="modalContent" class="clear-both pt-2"></div>
</div>
</div>

<script>
let currentType='all';
const JOBS=[
{id:1,title:'Assistant Director BPS-17',titleUr:'اسسٹنٹ ڈائریکٹر',dept:'FPSC',loc:'islamabad',city:'اسلام آباد',type:'gov',date:'15 اکتوبر',saved:false},
{id:2,title:'Sub Inspector',titleUr:'سب انسپکٹر',dept:'Punjab Police',loc:'lahore',city:'لاہور',type:'gov',date:'12 اکتوبر',saved:false},
{id:3,title:'Primary Teacher',titleUr:'پرائمری ٹیچر',dept:'KPPSC',loc:'peshawar',city:'پشاور',type:'gov',date:'18 اکتوبر',saved:false},
{id:4,title:'Clerk BPS-11',titleUr:'کلرک',dept:'Court',loc:'peshawar',city:'پشاور',type:'gov',date:'09 اکتوبر',saved:false},
{id:5,title:'Home Tuition',titleUr:'ہوم ٹیوشن',dept:'Private',loc:'peshawar',city:'یونیورسٹی ٹاؤن',type:'private',date:'08 اکتوبر',saved:false},
{id:6,title:'WAPDA Tender',titleUr:'واپڈا ٹینڈر',dept:'WAPDA',loc:'karachi',city:'کراچی',type:'tender',date:'20 اکتوبر',saved:false},
];

function render(list){
document.getElementById('jobsGrid').innerHTML=list.map(j=>`
<div class="card bg-white rounded-[20px] p-4">
<div class="flex justify-between">
<span class="text-[10px] font-bold bg-slate-900 text-white px-3 py-1 rounded-full">${j.dept}</span>
<span class="text-[10px] bg-orange-50 text-orange-700 px-3 py-1 rounded-full">${j.date}</span>
</div>
<h3 class="font-bold mt-3 text-sm">${j.title}</h3>
<p class="urdu text-[13px] font-bold text-slate-600">${j.titleUr} - ${j.city}</p>
<div class="mt-4 flex gap-2">
<button onclick="openJob(${j.id})" class="flex-1 bg-slate-900 text-white py-2.5 rounded-xl text-xs font-bold">تفصیل دیکھیں</button>
<button onclick="toggleSave(${j.id})" class="w-10 h-10 border-2 rounded-xl flex items-center justify-center ${j.saved?'bg-red-50 border-red-200 text-red-500':'bg-white'}">${j.saved?'❤️':'♡'}</button>
<button onclick="shareJob(${j.id})" class="w-10 h-10 border-2 rounded-xl">↗️</button>
</div>
</div>`).join('');
}
function filterType(t){
currentType=t;
document.querySelectorAll('[id^=btn-]').forEach(b=>b.classList.remove('filter-active'));
document.getElementById('btn-'+t).classList.add('filter-active');
filterJobs();
}
function filterJobs(){
const q=document.getElementById('searchInput').value.toLowerCase();
const loc=document.getElementById('locFilter').value;
let f=JOBS.filter(j=>{
let ok=true;
if(currentType!=='all' && j.type!==currentType) ok=false;
if(loc!=='all' && j.loc!==loc) ok=false;
if(q &&! (j.title+j.titleUr+j.dept).toLowerCase().includes(q)) ok=false;
return ok;
});
render(f);
}
function toggleSave(id){ const j=JOBS.find(x=>x.id===id); j.saved=!j.saved; filterJobs(); }
function shareJob(id){ alert('Link Copied: https://jobmela-bkb.pages.dev/?job='+id); }
function openJob(id){ document.getElementById('modalContent').innerHTML=`<h2 class="font-black">${JOBS.find(x=>x.id===id).title}</h2><p class="urdu mt-2">مکمل تفصیل یہاں آئے گی۔</p><a href="#" class="mt-4 block bg-orange-500 text-white text-center py-3 rounded-xl font-bold">اپلائی کریں</a>`; document.getElementById('modal').classList.remove('hidden'); }
function closeModal(){document.getElementById('modal').classList.add('hidden')}
function openLogin(){document.getElementById('loginModal').classList.remove('hidden')}
function closeLogin(){document.getElementById('loginModal').classList.add('hidden')}
function updateTime(){ document.getElementById('liveDate').innerText=new Date().toLocaleDateString('ur-PK',{day:'2-digit',month:'short'})+' - پشاور'; }
updateTime(); render(JOBS);
</script>
</body>
</html>
