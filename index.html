<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JobMela.pk - آپ کا مستقبل، ہماری تلاش</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@600;700&family=Inter:wght@700;800;900&display=swap" rel="stylesheet">
<style>
body{font-family:'Inter',sans-serif;background:#F6F8FB}
.urdu{font-family:'Noto Nastaliq Urdu',serif}
.hero-title{font-size:clamp(34px, 6vw, 58px);line-height:1.05;font-weight:900;letter-spacing:-1.5px}
.glass{backdrop-filter:blur(18px);background:rgba(255,255,255,0.85)}
.card{transition:all.3s cubic-bezier(.2,.8,.2,1)}
.card:hover{transform:translateY(-6px);box-shadow:0 25px 50px -12px rgba(0,0,0,0.15)}
.modal-in{animation:pop.35s ease}
@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:scale(1);opacity:1}}
</style>
</head>
<body class="text-slate-800">

<!-- Top Live Bar -->
<div class="bg-slate-900 text-white text-[12px] py-2.5 px-4">
<div class="max-w-7xl mx-auto flex justify-between">
<span id="liveDate">پشاور | لوڈ ہو رہا ہے...</span>
<span class="hidden md:block opacity-80">آپ کا مستقبل، ہماری تلاش • روزانہ 9 بجے اپڈیٹ</span>
</div>
</div>

<!-- Header -->
<header class="glass sticky top-0 z-40 border-b border-slate-200">
<div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
<div class="flex items-center gap-3">
<div class="w-12 h-12 rounded-2xl bg-gradient-to-br from-blue-600 to-indigo-700 flex items-center justify-center text-white font-black text-2xl shadow-lg shadow-blue-200">J</div>
<div>
<h1 class="font-black text-[22px] leading-none tracking-tight">JobMela.pk</h1>
<p class="urdu text-[15px] font-bold text-blue-600 leading-none mt-1">آپ کا مستقبل، ہماری تلاش</p>
</div>
</div>
<div class="bg-green-500 text-white text-[11px] font-bold px-3 py-1.5 rounded-full animate-pulse">● LIVE</div>
</div>
</header>

<!-- Hero -->
<section class="max-w-7xl mx-auto px-4 pt-10">
<div class="bg-white rounded-[2.5rem] p-8 md:p-12 border shadow-[0_30px_80px_-20px_rgba(0,0,0,0.1)]">
<h2 class="hero-title">پاکستان کی ہر<br><span class="text-transparent bg-clip-text bg-gradient-to-r from-blue-600 to-indigo-600">سرکاری نوکری</span><br>ایک ہی جگہ۔</h2>
<p class="urdu text-[18px] text-slate-500 mt-5 max-w-2xl leading-relaxed">آپ کا مستقبل، ہماری تلاش۔ FPSC, PPSC, KPPSC, پولیس، آرمی اور پرائیویٹ جابز کی تصدیق شدہ اپڈیٹس۔</p>

<div class="mt-8 flex flex-col md:flex-row gap-3 max-w-3xl">
<input id="searchInput" oninput="filterJobs()" type="text" placeholder="مثال: کلرک، ٹیچر، پشاور..." class="flex-1 bg-slate-100 border-2 border-transparent focus:border-blue-500 focus:bg-white outline-none rounded-2xl px-6 py-4 text-right transition-all">
<button onclick="filterJobs()" class="bg-slate-900 hover:bg-blue-600 text-white font-bold px-10 py-4 rounded-2xl transition-all">تلاش کریں</button>
</div>
</div>
</section>

<!-- Jobs -->
<section class="max-w-7xl mx-auto px-4 py-8 pb-20">
<div id="jobsGrid" class="grid md:grid-cols-3 gap-5"></div>
</section>

<!-- Modal -->
<div id="modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden z-50 p-4 flex items-center justify-center">
<div class="bg-white rounded-[2rem] max-w-lg w-full p-7 modal-in">
<button onclick="closeModal()" class="float-left bg-slate-100 w-8 h-8 rounded-full">✕</button>
<div id="modalContent" class="clear-both pt-2"></div>
</div>
</div>

document.getElementById('liveDate').innerText=`پشاور | ${dateStr} - ${timeStr}`;
}
setInterval(updateTime,1000); updateTime();
