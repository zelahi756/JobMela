<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JobHub - جاب ہب پاکستان</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@700&family=Inter:wght@600;800&display=swap" rel="stylesheet">
<style>
body{font-family:'Inter',sans-serif; background:#ff7a18; background:linear-gradient(135deg,#ff7a18 0%,#3b5bfe 100%); margin:0}
.urdu{font-family:'Noto Nastaliq Urdu',serif}
.card{background:rgba(255,255,255,0.95); border-radius:16px; padding:14px; border:1px solid rgba(255,255,255,0.6); box-shadow:0 8px 20px rgba(0,0,0,0.1)}
.pill-active{background:#2563eb !important; color:white !important}
</style>
</head>
<body>
<div style="max-width:1100px; margin:0 auto; background:rgba(255,255,255,0.88); min-height:100vh; border-radius:0; overflow:hidden">
<!-- Header -->
<div style="background:linear-gradient(90deg,#ff6a00,#3b5bfe); color:white; padding:12px 16px; display:flex; justify-content:space-between; align-items:center">
<div style="display:flex; align-items:center; gap:10px"><div style="background:white; color:#ff6a00; width:36px; height:36px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-weight:900">💼</div><div><div style="font-weight:900; font-size:18px">JobHub</div><div class="urdu" style="font-size:11px; margin-top:-4px">جاب ہب پاکستان</div></div></div>
<div style="display:flex; gap:8px; align-items:center"><div style="background:rgba(255,255,255,0.2); width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center">🔔</div><div style="background:white; color:#333; padding:6px 12px; border-radius:20px; font-size:12px; font-weight:700">👤 علی احمد</div></div>
</div>

<!-- Hero -->
<div style="margin:16px; background:linear-gradient(90deg,#ff7a18,#6d5bfe); border-radius:18px; padding:18px; color:white">
<div class="urdu" style="font-size:26px; font-weight:700">سرکاری نوکریاں تلاش کریں</div>
<div style="font-size:12px; opacity:0.9; margin-top:4px">1,243+ سرکاری نوکریاں دستیاب • آج 86 نئی نوکریاں شامل کی گئیں</div>
<div style="background:white; border-radius:12px; padding:6px; display:flex; gap:6px; margin-top:14px"><input id="search" oninput="doFilter()" placeholder="ملازمت، ادارہ، یا مقام تلاش کریں..." style="flex:1; background:#f1f5f9; border-radius:8px; border:none; padding:10px 14px; font-size:12px; outline:none"><button style="background:#ff6a00; color:white; padding:0 22px; border-radius:8px; font-weight:800; font-size:12px">تلاش کریں</button></div>
</div>

<!-- Filters -->
<div style="padding:0 16px; display:flex; gap:8px; overflow-x:auto">
<button onclick="setProv('all')" id="b-all" class="pill-active" style="white-space:nowrap; background:white; border:1px solid #ddd; padding:8px 18px; border-radius:20px; font-size:12px; font-weight:700">تمام All</button>
<button onclick="setProv('federal')" id="b-federal" style="white-space:nowrap; background:white; border:1px solid #ddd; padding:8px 18px; border-radius:20px; font-size:12px; font-weight:700">وفاقی Federal</button>
<button onclick="setProv('punjab')" id="b-punjab" style="white-space:nowrap; background:white; border:1px solid #ddd; padding:8px 18px; border-radius:20px; font-size:12px; font-weight:700">پنجاب Punjab</button>
<button onclick="setProv('sindh')" id="b-sindh" style="white-space:nowrap; background:white; border:1px solid #ddd; padding:8px 18px; border-radius:20px; font-size:12px; font-weight:700">سندھ Sindh</button>
<button onclick="setProv('kp')" id="b-kp" style="white-space:nowrap; background:white; border:1px solid #ddd; padding:8px 18px; border-radius:20px; font-size:12px; font-weight:700">خیبر KP</button>
<button onclick="setProv('today')" id="b-today" style="white-space:nowrap; background:white; border:1px solid #ddd; padding:8px 18px; border-radius:20px; font-size:12px; font-weight:700">آج کی Today</button>
</div>

<div style="padding:16px; display:flex; justify-content:space-between"><span class="urdu" style="font-weight:700; font-size:14px">نمایاں سرکاری نوکریاں • Featured Jobs</span><span style="color:#2563eb; font-size:11px; font-weight:700">View All →</span></div>

<div id="grid" style="padding:0 16px 100px 16px; display:grid; grid-template-columns:1fr 1fr; gap:12px"></div>

<div style="margin:0 16px 20px 16px; background:white; border-radius:14px; padding:14px; display:flex; justify-content:space-between; text-align:center; font-size:11px; font-weight:700; border:1px solid #eee"><div>🏢 156 ادارے<br><span style="font-weight:400">Departments</span></div><div style="border-left:1px solid #eee; border-right:1px solid #eee; padding:0 12px">💼 1,243 نوکریاں<br><span style="font-weight:400">Active Jobs</span></div><div>✅ 8,920+ درخواستیں<br><span style="font-weight:400">Applications</span></div></div>

</div>

<script>
let cur='all';
const JOBS=[
{id:1,d:'FPSC',t:'Assistant Director (BS-17)',o:'Federal Public Service Commission',l:'اسلام آباد • Islamabad',dl:'25 اکتوبر 2024',p:'federal',s:''},
{id:2,d:'Punjab Police',t:'Constable (BPS-07)',o:'Punjab Police Department',l:'لاہور • Lahore',dl:'30 اکتوبر',p:'punjab',s:''},
{id:3,d:'Pakistan Railways',t:'Engineer (Mechanical) BS-16',o:'Ministry of Railways',l:'Karachi • Contract',dl:'5 نومبر 2024',p:'sindh',s:'PKR 60k - 80k / month'},
{id:4,d:'NHS',t:'Medical Officer (BS-17)',o:'National Health Services',l:'Islamabad • Permanent',dl:'5 اکتوبر 2024',p:'federal',s:'PKR 90k - 110k / month'},
{id:5,d:'KPPSC',t:'Primary Teacher BPS-14',o:'Elementary Education KP',l:'پشاور • Peshawar',dl:'18 اکتوبر',p:'kp',s:'PKR 35k'},
{id:6,d:'WAPDA',t:'Clerk BPS-11',o:'WAPDA Works',l:'Rawalpindi',dl:'09 اکتوبر',p:'punjab',s:''}
];
function render(list){
document.getElementById('grid').innerHTML=list.map(j=>`
<div class="card">
<div style="display:flex; justify-content:space-between"><span style="background:#dbeafe; color:#1d4ed8; font-size:10px; font-weight:800; padding:3px 8px; border-radius:20px">${j.d}</span><span>🔖</span></div>
<div style="font-weight:800; font-size:12px; margin-top:8px; line-height:1.2">${j.t}</div>
<div style="font-size:10px; color:#666; margin-top:2px">${j.o}</div>
<div style="font-size:10px; margin-top:4px">📍 ${j.l}</div>
<div style="margin-top:8px; display:flex; gap:6px"><span style="background:#dbeafe; color:#1d4ed8; font-size:9px; padding:4px 8px; border-radius:20px">سرکاری</span><span style="background:#ff6a00; color:white; font-size:9px; padding:4px 8px; border-radius:20px">Deadline: ${j.dl}</span></div>
${j.s?`<div style="margin-top:8px; background:linear-gradient(90deg,#ff6a00,#3b5bfe); color:white; font-size:10px; font-weight:700; padding:5px 10px; border-radius:20px; display:inline-block">${j.s}</div>`:''}
</div>`).join('');
}
function setProv(p){cur=p; document.querySelectorAll('[id^=b-]').forEach(b=>b.classList.remove('pill-active')); document.getElementById('b-'+p).classList.add('pill-active'); doFilter();}
function doFilter(){const q=document.getElementById('search').value.toLowerCase(); let f=JOBS.filter(j=>{ if(cur!=='all' && cur!=='today' && j.p!==cur) return false; if(cur==='today' && j.id>2) return false; if(q && !j.t.toLowerCase().includes(q)) return false; return true}); render(f);}
render(JOBS);
</script>
</body>
</html>
