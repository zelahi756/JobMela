<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JobMela.pk - آپ کا مستقبل، ہماری تلاش</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@600;700&family=Inter:wght@700;800;900&display=swap" rel="stylesheet">
<style>
body{font-family:'Inter',sans-serif;background:#FFF7ED}
.urdu{font-family:'Noto Nastaliq Urdu',serif; line-height:1.9}
.card{transition:all.3s ease; border:1px solid #FFEDD5}
.card:hover{transform:translateY(-6px); box-shadow:0 25px 50px -15px rgba(249,115,22,.25)}
.gradient-header{background: linear-gradient(135deg, #FF6B00 0%, #EA580C 40%, #1E3A8A 100%);}
.glass{background:rgba(255,255,255,0.85); backdrop-filter:blur(12px)}
</style>
</head>
<body>

<!-- Top Live -->
<div class="bg-slate-900 text-white text-[11px] py-2 px-4">
<div class="max-w-7xl mx-auto flex justify-between">
<span id="liveDate">پشاور | لوڈ ہو رہا ہے...</span>
<span class="hidden md:block">🔥 آج 6 نئی نوکریاں شامل کی گئیں</span>
</div>
</div>

<!-- Header with Gradient -->
<header class="gradient-header text-white sticky top-0 z-40 shadow-lg">
<div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
<div class="flex items-center gap-3">
<div class="w-11 h-11 rounded-xl bg-white text-orange-600 flex items-center justify-center font-black text-xl">J</div>
<div>
<h1 class="font-black text-xl leading-none">JobMela.pk</h1>
<p class="urdu text-[13px] -mt-1 font-bold opacity-90">آپ کا مستقبل، ہماری تلاش</p>
</div>
</div>
<span class="bg-white text-orange-600 text-[11px] font-black px-4 py-1.5 rounded-full">● LIVE</span>
</div>
</header>

<!-- Hero - Orange Style -->
<section class="max-w-7xl mx-auto px-4 pt-6">
<div class="bg-white rounded-[28px] p-7 md:p-10 border-2 border-orange-100 shadow-[0_20px_60px_-20px_rgba(249,115,22,0.2)]">
<h2 class="text-[32px] md:text-[46px] font-black leading-[1.1] tracking-tight">نوکری ڈھونڈنا<br><span class="text-transparent bg-clip-text bg-gradient-to-r from-orange-500 to-blue-700">ہوا اور بھی آسان!</span></h2>
<p class="urdu text-[17px] text-slate-600 mt-3 max-w-2xl">پاکستان کی ہر تصدیق شدہ سرکاری نوکری، ٹینڈر اور ہوم ٹیوشن اب ایک ہی جگہ۔</p>
<div class="mt-6 flex gap-2 bg-orange-50 p-2 rounded-2xl border border-orange-100 max-w-2xl">
<input id="searchInput" oninput="filterJobs()" placeholder="مثلاً: کلرک، ٹیچر، پشاور..." class="flex-1 bg-white rounded-xl px-5 py-3.5 text-sm outline-none border-2 border-transparent focus:border-orange-400 text-right">
<button class="bg-gradient-to-r from-orange-500 to-orange-600 hover:from-orange-600 hover:to-orange-700 text-white px-8 rounded-xl font-black text-sm shadow-lg shadow-orange-200">تلاش کریں</button>
</div>
</div>
</section>

<!-- Jobs Grid -->
<section class="max-w-7xl mx-auto px-4 py-6 pb-20">
<div id="jobsGrid" class="grid md:grid-cols-2 lg:grid-cols-3 gap-5"></div>
</section>

<!-- Modal -->
<div id="modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden z-50 p-4 flex items-center justify-center">
<div class="bg-white rounded-[24px] max-w-lg w-full p-7">
<button onclick="closeModal()" class="float-left bg-slate-100 w-8 h-8 rounded-full">✕</button>
<div id="modalContent" class="clear-both pt-2"></div>
</div>
</div>

<script>
function updateTime(){
const n=new Date();
const d=n.toLocaleDateString('ur-PK',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
const t=n.toLocaleTimeString('en-PK',{hour:'2-digit',minute:'2-digit'});
document.getElementById('liveDate').innerText=`پشاور | ${d} - ${t}`;
}
setInterval(updateTime,1000); updateTime();

const JOBS=[
{id:1,titleEn:'Assistant Director (BPS-17)',titleUr:'اسسٹنٹ ڈائریکٹر',dept:'FPSC',deptUr:'وفاقی کمیشن',loc:'اسلام آباد',date:'15 اکتوبر',color:'from-blue-600 to-indigo-700',en:'Federal Govt job. Age 28 years.',ur:'وفاقی حکومت میں شاندار موقع، عمر 28 سال۔',link:'https://fpsc.gov.pk'},
{id:2,titleEn:'Sub Inspector (BPS-14)',titleUr:'سب انسپکٹر',dept:'Punjab Police',deptUr:'پنجاب پولیس',loc:'لاہور',date:'12 اکتوبر',color:'from-slate-800 to-slate-900',en:'Height 5.7 inch required.',ur:'قد 5.7 انچ اور دوڑ لازمی۔',link:'#'},
{id:3,titleEn:'Primary School Teacher',titleUr:'پرائمری ٹیچر',dept:'KPPSC',deptUr:'خیبر پختونخوا',loc:'پشاور',date:'18 اکتوبر',color:'from-emerald-500 to-teal-600',en:'1200+ vacancies through ETEA.',ur:'1200 آسامیوں کے لیے ETEA ٹیسٹ۔',link:'#'},
{id:4,titleEn:'Clerk BPS-11',titleUr:'کلرک',dept:'Court',deptUr:'عدالت',loc:'راولپنڈی',date:'09 اکتوبر',color:'from-orange-500 to-red-600',en:'Typing 30 WPM must.',ur:'ٹائپنگ 30 الفاظ فی منٹ۔',link:'#'},
{id:5,titleEn:'Home Tuition',titleUr:'ہوم ٹیوشن',dept:'Private',deptUr:'پرائیویٹ',loc:'یونیورسٹی ٹاؤن',date:'08 اکتوبر',color:'from-violet-500 to-purple-600',en:'Evening 4-6 PM, 15k salary.',ur:'شام 4 سے 6 بجے، 15 ہزار تنخواہ۔',link:'#'},
{id:6,titleEn:'Construction Tender',titleUr:'تعمیراتی ٹینڈر',dept:'WAPDA',deptUr:'واپڈا',loc:'کراچی',date:'20 اکتوبر',color:'from-amber-500 to-orange-600',en:'For registered firms.',ur:'رجسٹرڈ کمپنیوں کے لیے۔',link:'#'}
];

function render(list){
document.getElementById('jobsGrid').innerHTML=list.map(j=>`
<div class="card bg-white rounded-[22px] p-5">
<div class="flex justify-between items-center">
<span class="text-[10px] font-black px-3 py-1 rounded-full text-white bg-gradient-to-r ${j.color}">${j.dept}</span>
<span class="text-[11px] bg-orange-50 text-orange-700 border border-orange-100 px-3 py-1 rounded-full font-bold">${j.date}</span>
</div>
<h3 class="font-black text-[16px] mt-4 leading-tight">${j.titleEn}</h3>
<p class="urdu text-[15px] font-bold text-orange-600 leading-tight">${j.titleUr} - ${j.deptUr}</p>
<p class="text-[12px] text-slate-500 mt-2">📍 ${j.loc}</p>
<div class="mt-3 bg-gradient-to-br from-slate-50 to-orange-50/50 rounded-xl p-3 border border-orange-50">
<p class="text-[12px]">${j.en}</p>
<p class="urdu text-[13px] text-slate-700 mt-1">${j.ur}</p>
</div>
<div class="mt-4 flex gap-2">
<button onclick="openJob(${j.id})" class="flex-1 bg-gradient-to-r ${j.color} text-white py-3 rounded-xl text-[13px] font-black shadow-md">تفصیل دیکھیں</button>
<a href="${j.link}" target="_blank" class="px-5 py-3 rounded-xl border-2 font-bold text-[13px] hover:bg-slate-50">اپلائی</a>
</div>
</div>`).join('');
}
function openJob(id){
const j=JOBS.find(x=>x.id===id);
document.getElementById('modalContent').innerHTML=`
<h2 class="font-black text-xl">${j.titleEn}</h2>
<p class="urdu text-lg font-bold text-orange-600">${j.titleUr}</p>
<p class="urdu mt-4 bg-orange-50 p-4 rounded-xl border border-orange-100">${j.ur}</p>
<p class="text-sm mt-2 bg-slate-50 p-3 rounded-xl">${j.en}</p>
<a href="${j.link}" target="_blank" class="mt-6 block text-center bg-gradient-to-r ${j.color} text-white font-black py-3.5 rounded-xl">اصل اشتہار پر اپلائی کریں</a>
`;
document.getElementById('modal').classList.remove('hidden');
}
function closeModal(){document.getElementById('modal').classList.add('hidden')}
function filterJobs(){
const q=document.getElementById('searchInput').value.toLowerCase();
const f=JOBS.filter(j=>(j.titleEn+j.titleUr+j.dept+j.loc).toLowerCase().includes(q));
render(f);
}
render(JOBS);
</script>
</body>
</html>
