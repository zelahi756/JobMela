<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JobMela.pk - V2</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@600&family=Inter:wght@600;800&display=swap" rel="stylesheet">
<style>
body{font-family:'Inter',sans-serif;background:#F8FAFC}
.urdu{font-family:'Noto Nastaliq Urdu',serif}
.card{transition:.3s;backdrop-filter:blur(10px)}
.card:hover{transform:translateY(-6px) scale(1.01);box-shadow:0 25px 40px -15px rgba(0,0,0,.15)}
.animate-in{animation:pop.4s ease}
@keyframes pop{from{transform:scale(.95);opacity:0}to{transform:scale(1);opacity:1}}
</style>
</head>
<body>

<header class="sticky top-0 z-40 bg-white/70 backdrop-blur-xl border-b">
<div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
<div class="flex items-center gap-2">
<div class="w-10 h-10 rounded-xl bg-gradient-to-br from-orange-500 via-red-500 to-indigo-600 flex items-center justify-center text-white font-black">J</div>
<div><h1 class="font-black text-lg">JobMela.pk</h1><p class="urdu text-xs -mt-1 text-slate-500">ہر کام کا میلہ - V2 Live</p></div>
</div>
<span class="text-xs bg-gradient-to-r from-green-500 to-emerald-600 text-white px-3 py-1 rounded-full">● 6 نئی نوکریاں</span>
</div>
</header>

<section class="max-w-7xl mx-auto p-4">
<div id="jobsGrid" class="grid md:grid-cols-2 lg:grid-cols-3 gap-4 mt-6"></div>
</section>

<!-- Detail Modal -->
<div id="modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm hidden z-50 p-4 flex items-center justify-center">
<div class="bg-white rounded-[2rem] max-w-lg w-full p-6 animate-in">
<button onclick="closeModal()" class="float-left bg-slate-100 w-8 h-8 rounded-full">✕</button>
<div id="modalContent"></div>
</div>
</div>

<script>
const JOBS=[
{id:1,title:'Assistant Director (BPS-17)',dept:'FPSC - Federal',loc:'Islamabad',date:'15 Oct 2026',edu:'Graduation',link:'https://www.fpsc.gov.pk',desc:'وفاقی حکومت کی شاندار نوکری، عمر کی حد 28 سال، پورے پاکستان سے اپلائی کر سکتے ہیں۔'},
{id:2,title:'Sub Inspector Punjab Police',dept:'Punjab Police',loc:'Lahore',date:'12 Oct 2026',edu:'Intermediate',link:'https://punjabpolice.gov.pk',desc:'پنجاب پولیس میں بھرتی، قد 5.7 انچ، دوڑ ٹیسٹ لازمی۔'},
{id:3,title:'Primary School Teacher',dept:'KP Education',loc:'Peshawar',date:'18 Oct 2026',edu:'Graduation',link:'https://etea.edu.pk',desc:'خیبر پختونخوا میں پرائمری ٹیچر کی 1200+ آسامیاں۔'},
{id:4,title:'WAPDA Tender - Construction',dept:'WAPDA',loc:'Karachi',date:'20 Oct 2026',edu:'All',link:'#',desc:'اسکول بلڈنگ کا ٹینڈر، تجربہ کار کمپنیوں کے لیے۔',type:'tender'},
{id:5,title:'Home Tuition',dept:'Private',loc:'University Town',date:'8 Oct 2026',edu:'Graduation',link:'#',desc:'ماہانہ 15,000، شام 4 سے 6 بجے۔',type:'gig',budget:'Rs. 15,000'},
{id:6,title:'Clerk BPS-11',dept:'District Court',loc:'Rawalpindi',date:'9 Oct 2026',edu:'Matric',link:'#',desc:'عدالت میں کلرک کی نوکری، ٹائپنگ سپیڈ 30 WPM۔'}
];

function render(){
document.getElementById('jobsGrid').innerHTML=JOBS.map(j=>`
<div class="card bg-white rounded-[1.8rem] border border-slate-100 p-5">
<div class="flex justify-between"><span class="text-[11px] font-bold bg-slate-900 text-white px-3 py-1 rounded-full">${j.dept}</span><span class="text-[11px] bg-orange-100 text-orange-700 px-3 py-1 rounded-full">${j.date}</span></div>
<h3 class="font-extrabold mt-3 text-[16px]">${j.title}</h3>
<p class="text-xs text-slate-500 mt-1">${j.loc} • ${j.edu}</p>
<div class="mt-4 flex gap-2">
<button onclick="openJob(${j.id})" class="flex-1 bg-gradient-to-r from-slate-900 to-slate-800 text-white py-2.5 rounded-xl text-sm font-bold hover:from-orange-500 hover:to-red-500 transition-all">تفصیل دیکھیں</button>
<a href="${j.link}" target="_blank" class="border px-4 py-2.5 rounded-xl text-sm">اپلائی</a>
</div>
</div>`).join('');
}
function openJob(id){
const j=JOBS.find(x=>x.id===id);
document.getElementById('modalContent').innerHTML=`
<h2 class="font-black text-xl">${j.title}</h2>
<p class="urdu text-slate-600 mt-2 leading-relaxed">${j.desc}</p>
<div class="grid grid-cols-2 gap-2 mt-4 text-xs">
<div class="bg-slate-50 p-3 rounded-xl">محکمہ: <b>${j.dept}</b></div>
<div class="bg-slate-50 p-3 rounded-xl">لوکیشن: <b>${j.loc}</b></div>
<div class="bg-slate-50 p-3 rounded-xl">تعلیم: <b>${j.edu}</b></div>
<div class="bg-slate-50 p-3 rounded-xl">آخری تاریخ: <b>${j.date}</b></div>
</div>
<a href="${j.link}" target="_blank" class="mt-6 block text-center bg-gradient-to-r from-orange-500 to-red-600 text-white font-bold py-3 rounded-xl">اصل اشتہار پر اپلائی کریں</a>
`;
document.getElementById('modal').classList.remove('hidden');
}
function closeModal(){document.getElementById('modal').classList.add('hidden')}
render();
</script>
</body>
</html>
